name: CPLayout required

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: cplayout-required-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "1"

jobs:
  source:
    name: source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_USER: cplayout_test
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: cplayout
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cplayout_test -d cplayout"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CPLAYOUT_TEST_DATABASE_URL: postgresql://cplayout_test:synthetic-ci-only@127.0.0.1:5432/cplayout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          cache: npm
      - run: npm ci
      - name: Check changed-file whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$BASE_SHA" =~ ^0{40}$ ]]; then
            BASE_SHA="$(git hash-object -t tree -w --stdin </dev/null)"
          fi
          git cat-file -e "$HEAD_SHA^{commit}"
          git diff --check "$BASE_SHA" "$HEAD_SHA" --
      - name: Check Expo SDK compatibility
        run: npx expo install --check
        working-directory: apps/mobile
      - run: npm run context-map:check
      - run: npm run validate:skills
      - run: npm run workflow:check
      - name: Audit current and retained browser contract inventory
        run: npm run proof:inventory
      - run: npm run validate
      - name: Export the app and exercise the actual PostgreSQL HTTP gateway
        run: |
          npm run export:web
          npm run test:service-smoke
      - name: Record raw audit and verify exact dependency mitigations
        run: npm run audit:verified
      - name: Retain dependency audit evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit
          path: reports/dependency-audit/
          if-no-files-found: warn
          retention-days: 7

  web:
    name: web (${{ matrix.shard }}/3)
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      CPLAYOUT_WEB_PROOF_PORT: "19006"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # All current-App and applicable platform contracts are selected by the
      # audited registry. Retained old-navigation obligations remain explicit
      # migration debt. Each served app owns one receiver companion.
      - run: xvfb-run -a npm run proof:web -- --shard=${{ matrix.shard }}/3 --workers=1
      - name: Retain failed browser evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-shard-${{ matrix.shard }}
          path: |
            reports/continuous-improvement/playwright-results/
            reports/continuous-improvement/playwright-html/
          if-no-files-found: warn
          retention-days: 7

  cplayout-required:
    name: cplayout-required
    if: ${{ always() }}
    needs: [source, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require source and every web shard
        env:
          SOURCE_RESULT: ${{ needs.source.result }}
          WEB_RESULT: ${{ needs.web.result }}
        run: |
          test "$SOURCE_RESULT" = success
          test "$WEB_RESULT" = success
