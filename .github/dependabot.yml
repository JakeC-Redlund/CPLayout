version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Denver
    open-pull-requests-limit: 6
    commit-message:
      prefix: "chore(deps)"
    groups:
      expo-react-peers:
        patterns: ["expo", "expo-*", "@expo/*", "react", "react-dom", "react-native", "react-native-*", "@react-native/*"]
        update-types: [minor, patch]
      map-renderers:
        patterns: ["@maplibre/*", "maplibre-gl", "pmtiles"]
        update-types: [minor, patch]
      geometry-interchange:
        patterns: ["proj4", "polygon-clipping", "polyclip-ts", "@placemarkio/*", "@tmcw/*", "@xmldom/*"]
        update-types: [minor, patch]
      storage-contracts:
        patterns: ["fflate", "jsonc-parser", "zod"]
        update-types: [minor, patch]
      compiler-browser-tools:
        patterns: ["typescript", "tsx", "@types/*", "@playwright/test", "@axe-core/*", "axe-core"]
        update-types: [minor, patch]
      security-fixes:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Denver
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(actions)"
    groups:
      pinned-actions:
        patterns: ["*"]
        update-types: [minor, patch]
