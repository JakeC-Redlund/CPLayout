#:schema https://developers.openai.com/codex/config-schema.json

# Model and reasoning effort are selected per task/session in AGENTS.md instead
# of pinned to a project-wide default that may be unavailable to another client.

[features]
multi_agent = true
hooks = true

[agents]
max_concurrent_threads_per_session = 6

[agents.cplayout_imagery_mapper]
description = "Read-only specialist for Google Earth imagery evidence, field-boundary CV review, and pivot-layout imagery mapping."
config_file = "agents/cplayout_imagery_mapper.toml"

[agents.cplayout_interface_developer]
description = "Read-only specialist for CPLayout interface, UI/UX, Expo, and web/native verification planning."
config_file = "agents/cplayout_interface_developer.toml"

[agents.cplayout_center_pivot_designer]
description = "Read-only specialist for center pivot, lateral move, and corner-arm design evidence and scoring review."
config_file = "agents/cplayout_center_pivot_designer.toml"

[agents.cplayout_database_specialist]
description = "Read-only specialist for SQLite, project-store, archive, migration, and CRUD integration review."
config_file = "agents/cplayout_database_specialist.toml"

[agents.cplayout_kb_curator]
description = "Read-only curator for CPLayout source ledgers, prompt registry, known gaps, and durable agent guidance."
config_file = "agents/cplayout_kb_curator.toml"

[agents.cplayout_runtime_proof_gatekeeper]
description = "Read-only specialist for native/runtime proof gates, release evidence, and production-readiness claims."
config_file = "agents/cplayout_runtime_proof_gatekeeper.toml"

[agents.cplayout_gis_geometry_guardian]
description = "Read-only specialist for projected/local XY, CRS, WGS84 display/input, coordinate transforms, and tile package boundaries."
config_file = "agents/cplayout_gis_geometry_guardian.toml"

[agents.cplayout_qa_validation_reviewer]
description = "Read-only specialist for validation triage, acceptance gates, audit findings, regression evidence, and release evidence."
config_file = "agents/cplayout_qa_validation_reviewer.toml"
